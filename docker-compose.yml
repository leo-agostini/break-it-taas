# Everything except the outbox worker runs here: the API, the frontend, the
# database, and the target API the load tests hit.
#
# The outbox worker is deliberately absent. It dispatches Kubernetes Jobs and
# needs a kubeconfig, so it runs on your host — ops/dev-up.sh starts it for you
# after bringing this stack up.

# Shared by the API and the one-shot migrate container: Adonis validates the
# whole env schema (start/env.ts) at boot, whichever command runs.
x-backend-env: &backend-env
    NODE_ENV: production
    PORT: "3001"
    HOST: 0.0.0.0
    LOG_LEVEL: info
    # Local-only key; production must inject its own secret.
    APP_KEY: local-dev-app-key-change-me-in-production
    APP_URL: http://localhost:3001
    # The session cookie is the auth credential (ADR-008). Frontend and API are
    # both on localhost here, so Lax + non-Secure works over plain http.
    SESSION_DRIVER: cookie
    SESSION_SAMESITE: lax
    SESSION_SECURE: "false"
    CORS_ORIGIN: http://localhost:3000
    RUNNER_SHARED_SECRET: local-runner-shared-secret
    # The API only serves the callback endpoint; the worker is what tells
    # runner pods where to POST. Kept because the env schema requires it.
    RUNNER_CALLBACK_BASE_URL: http://localhost:3001
    RUNNER_IMAGE: breakit-k6-runner:local
    KUBERNETES_NAMESPACE: app
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
    # OpenTelemetry (backend/config/otel.ts). Off unless the observability
    # profile is up — ops/dev-up.sh flips it with OBSERVABILITY=1 — so the plain
    # stack does not keep retrying an Alloy that is not there.
    APP_NAME: breakit-backend
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318

services:
    frontend:
        build:
            # Repo root: frontend/Dockerfile copies tsconfig.base.json from the
            # workspace root, so ./frontend is too narrow a context.
            context: .
            dockerfile: frontend/Dockerfile
            args:
                - VITE_API_URL=http://localhost:3001/api
                - VITE_API_SERVER_URL=http://backend:3001/api
                # Faro collector; empty (the default) builds without browser
                # telemetry. ops/dev-up.sh sets it with OBSERVABILITY=1.
                - VITE_FARO_URL=${VITE_FARO_URL:-}
        container_name: breakit-frontend
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
        depends_on:
            backend:
                condition: service_started

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: breakit-backend
        ports:
            - "3001:3001"
        environment: *backend-env
        depends_on:
            migrate:
                condition: service_completed_successfully

    migrate:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: breakit-migrate
        environment: *backend-env
        command: ["node", "ace", "migration:run", "--force"]
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        container_name: breakit-postgres
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=app
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 5s
            timeout: 5s
            retries: 10

    # The API under test. Runner pods reach it through the host gateway, so the
    # port must be published. CPU is capped low on purpose — a load test is only
    # interesting if it can actually saturate its target.
    load-target:
        image: hashicorp/http-echo:1.0.0
        container_name: breakit-load-target
        command: ["-listen=:8080", "-text=ok"]
        ports:
            - "8080:8080"
        deploy:
            resources:
                limits:
                    cpus: "0.1"
                    memory: 160M

    # ── Observability stack ───────────────────────────────────────────────────
    # Opt-in via the "observability" profile so `docker compose up` stays light
    # on a constrained machine:
    #   docker compose --profile observability up -d
    # These live in this file (rather than a separate one) on purpose: it puts
    # them on the same default network, so `backend` and `frontend` can resolve
    # `alloy` by name with no extra network wiring.

    # The single collector: OTLP and Faro receiver, Docker log tailer, cAdvisor
    # scraper, and reader of the kind cluster, in one process. Replaces
    # otel-collector + promtail + cadvisor + an in-cluster agent.
    alloy:
        # >= v1.20: older faro.receivers reject the Idempotency-Key header that
        # the Faro web SDK (2.x) sends, so every browser preflight fails CORS.
        image: grafana/alloy:v1.21.2
        container_name: breakit-alloy
        profiles: ["observability"]
        # Root is required to read the Docker socket; the socket itself is
        # mounted read-only.
        user: root
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
        environment:
            - KIND_API_ADDRESS=${WORKLOAD_CLUSTER_NAME:-taas-dev}-control-plane:6443
        # `kind` is how Alloy reaches the cluster's API server (ADR-009).
        networks: [default, kind]
        ports:
            - "4317:4317"   # OTLP gRPC
            - "4318:4318"   # OTLP HTTP
            - "12345:12345" # Alloy's own UI
            - "12347:12347" # Faro receiver (browser telemetry)
        volumes:
            - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            # cAdvisor needs these to enumerate per-container cgroups. Without
            # them it reports only the root cgroup (id="/") and every
            # per-container panel stays empty.
            - /:/rootfs:ro
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
            # cAdvisor talks to containerd to resolve the overlayfs storage
            # driver. Without this it finds the container cgroups but fails with
            # "unable to create containerd client" and emits no per-container
            # series at all.
            - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
            # Read-only cluster credentials from ops/observability/write-kubeconfig.sh.
            - ./ops/observability/.kube:/etc/kube:ro
            - alloy-data:/var/lib/alloy/data
        depends_on:
            - loki
            - tempo
            - prometheus
        deploy:
            resources:
                limits:
                    # 200M was OOM-killed by cAdvisor alone; the cluster
                    # discovery and log tailing add to that.
                    memory: 400M

    # Runner Job and pod state for the test-runners dashboard. It runs here, not
    # in the cluster, and watches the API server through the read-only
    # telemetry-reader kubeconfig, scoped to the runner namespace.
    kube-state-metrics:
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        container_name: breakit-kube-state-metrics
        profiles: ["observability"]
        command:
            - --kubeconfig=/etc/kube/config
            - --namespaces=app
            - --resources=jobs,pods
        networks: [default, kind]
        volumes:
            - ./ops/observability/.kube:/etc/kube:ro
        deploy:
            resources:
                limits:
                    memory: 64M

    prometheus:
        image: prom/prometheus:v3.1.0
        container_name: breakit-prometheus
        profiles: ["observability"]
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            # Required for Alloy, Tempo's generator, and k6 runner pods, which
            # all push rather than being scraped.
            - --web.enable-remote-write-receiver
            # Lets a latency graph link straight to an example trace.
            - --enable-feature=exemplar-storage
            - --web.enable-lifecycle
        ports:
            - "9090:9090"
        volumes:
            - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
            - prometheus-data:/prometheus
        deploy:
            resources:
                limits:
                    memory: 400M

    loki:
        image: grafana/loki:3.3.2
        container_name: breakit-loki
        profiles: ["observability"]
        command: ["-config.file=/etc/loki/loki-config.yaml"]
        ports:
            - "3100:3100"
        volumes:
            - ./ops/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
            - loki-data:/loki
        deploy:
            resources:
                limits:
                    memory: 300M

    tempo:
        image: grafana/tempo:2.7.0
        container_name: breakit-tempo
        profiles: ["observability"]
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        ports:
            - "3200:3200"
        volumes:
            - ./ops/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
        deploy:
            resources:
                limits:
                    memory: 300M

    grafana:
        image: grafana/grafana:11.5.1
        container_name: breakit-grafana
        profiles: ["observability"]
        # 3000 is the frontend and 3001 the API, so Grafana takes 3002.
        ports:
            - "3002:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
            - GF_LOG_LEVEL=warn
        volumes:
            - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        depends_on:
            - prometheus
            - loki
            - tempo
        deploy:
            resources:
                limits:
                    memory: 200M

    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.16.0
        container_name: breakit-postgres-exporter
        profiles: ["observability"]
        environment:
            - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/app?sslmode=disable
        # Outbox backlog gauges (see the file for why they live here).
        command: ["--extend.query-path=/etc/postgres-exporter/queries.yaml"]
        volumes:
            - ./ops/observability/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
        ports:
            - "9187:9187"
        depends_on:
            postgres:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 64M

# Created by kind. Only the observability profile joins it, so the plain stack
# starts without a cluster.
networks:
    kind:
        external: true
        name: kind

volumes:
    postgres-data:
    prometheus-data:
    loki-data:
    tempo-data:
    grafana-data:
    alloy-data:
