# Single-binary Loki with filesystem storage. Sized for a laptop, but the
# retention and limits blocks are real settings, not placeholders — they are the
# knobs you would actually tune in a deployed environment.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Runner pods live for the duration of a load test and can emit a lot at once;
  # the default 4MB/s burst is too tight for that spike.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_label_names_per_series: 30
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h
  # Guards against a stray high-cardinality label (e.g. someone promoting
  # trace_id or test_run_id to a Loki label) taking the whole store down.
  max_streams_per_user: 5000
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
